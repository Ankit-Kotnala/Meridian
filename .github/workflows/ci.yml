name: CI

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: npm ci
      - run: uv sync --project backend --frozen --package rezumi-api
      - run: npm run contracts:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: rezumi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rezumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rezumi -d rezumi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REZUMI_DATABASE_URL: postgresql+asyncpg://rezumi:ci-only-password@127.0.0.1:5432/rezumi
      REZUMI_TEST_DATABASE_URL: postgresql+asyncpg://rezumi:ci-only-password@127.0.0.1:5432/rezumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv lock --project backend --check
      - run: uv sync --project backend --frozen --all-packages --all-groups
      - run: cd backend/core && uv run --package rezumi-backend ruff format --check .
      - run: cd backend/core && uv run --package rezumi-backend ruff check .
      - run: cd backend/core && uv run --package rezumi-backend mypy
      - run: cd backend/core && uv run --package rezumi-backend pytest tests/architecture tests/unit
      - run: cd backend/api && uv run ruff format --check .
      - run: cd backend/api && uv run ruff check .
      - run: cd backend/api && uv run mypy
      - run: cd backend/api && uv run pytest
      - run: uv run --project backend --package rezumi-api ruff format --config backend/api/pyproject.toml --check shared/contracts/scripts/export_openapi.py
      - run: uv run --project backend --package rezumi-api ruff check --config backend/api/pyproject.toml shared/contracts/scripts/export_openapi.py
      - run: test "$(uv run --project backend --package rezumi-backend alembic -c backend/core/alembic.ini heads | sed -n '/^[^[:space:]][^[:space:]]* (head)$/p')" = "20260823_0017 (head)"
      - run: uv run --project backend --package rezumi-backend alembic -c backend/core/alembic.ini upgrade head
      - run: uv run --project backend --package rezumi-backend alembic -c backend/core/alembic.ini downgrade 20260724_0009
      - run: uv run --project backend --package rezumi-backend alembic -c backend/core/alembic.ini upgrade head
      - run: test "$(uv run --project backend --package rezumi-backend alembic -c backend/core/alembic.ini current | sed -n '/^[^[:space:]][^[:space:]]* (head)$/p')" = "20260823_0017 (head)"
      - run: cd backend/core && uv run --package rezumi-backend pytest tests/integration
      - run: uv run --project backend --package rezumi-api python -c "from rezumi_api.main import app; assert app.openapi()"

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --project backend --frozen --package rezumi-worker --all-groups
      - run: cd backend/worker && uv run ruff format --check .
      - run: cd backend/worker && uv run ruff check .
      - run: cd backend/worker && uv run mypy
      - run: cd backend/worker && uv run pytest
      - run: uv run --project backend --package rezumi-worker python -c "from rezumi_worker.app import celery_app; assert celery_app.main == 'rezumi_worker'"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the working tree for committed secrets
        run: >-
          docker run --rm --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: uv sync --project backend --frozen --all-packages --all-groups
      - run: uv run --project backend --package rezumi-api --with pip-audit==2.10.1 pip-audit

  browser-smoke:
    runs-on: ubuntu-latest
    needs: [web-and-contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=@rezumi/web -- playwright install --with-deps chromium
      - run: npm run test:e2e

  full-stack-e2e:
    runs-on: ubuntu-latest
    needs: [api, worker, web-and-contracts]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: cp .env.example .env
      - run: npm ci
      - run: uv sync --project backend --frozen --all-packages --all-groups
      - run: npm exec --workspace=@rezumi/web -- playwright install --with-deps chromium
      - name: Run the full isolated Compose journey suite (Phase 9)
        run: REZUMI_E2E_PHASE=9 sh tests/e2e/run-compose.sh

  containers:
    runs-on: ubuntu-latest
    needs: [api, worker, web-and-contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose -f infra/compose.yaml --project-directory . config --quiet
      - run: docker compose -f infra/compose.yaml --project-directory . build api worker web web-edge
      - name: Start the Compose platform
        run: |
          if ! docker compose -f infra/compose.yaml --project-directory . up --detach --wait --wait-timeout 300; then
            docker compose -f infra/compose.yaml --project-directory . ps --all
            docker compose -f infra/compose.yaml --project-directory . logs --no-color --tail 200
            exit 1
          fi
      - name: Verify the packaged migration path
        run: |
          heads=$(docker compose -f infra/compose.yaml --project-directory . run --rm --no-deps api alembic -c backend/core/alembic.ini heads | sed -n '/^[^[:space:]][^[:space:]]* (head)$/p')
          printf '%s\n' "$heads"
          test "$heads" = "20260823_0017 (head)"
          docker compose -f infra/compose.yaml --project-directory . run --rm --no-deps api alembic -c backend/core/alembic.ini upgrade head
          docker compose -f infra/compose.yaml --project-directory . run --rm --no-deps api alembic -c backend/core/alembic.ini downgrade 20260724_0009
          docker compose -f infra/compose.yaml --project-directory . run --rm --no-deps api alembic -c backend/core/alembic.ini upgrade head
          current=$(docker compose -f infra/compose.yaml --project-directory . run --rm --no-deps api alembic -c backend/core/alembic.ini current | sed -n '/^[^[:space:]][^[:space:]]* (head)$/p')
          printf '%s\n' "$current"
          test "$current" = "20260823_0017 (head)"
      - name: Probe the running platform
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/meta
          curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/info
          docker compose -f infra/compose.yaml --project-directory . exec -T worker celery --app rezumi_worker.app:celery_app inspect ping --timeout 5
          scheduler_id=$(docker compose -f infra/compose.yaml --project-directory . ps --quiet worker-scheduler)
          test -n "$scheduler_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$scheduler_id")" = healthy
      - name: Scan API image for fixable high vulnerabilities
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.grype.yaml:/etc/grype.yaml:ro"
          --volume rezumi-grype-cache:/root/.cache/grype
          anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d
          rezumi-api:latest --config /etc/grype.yaml --fail-on high --only-fixed
      - name: Scan worker image for fixable high vulnerabilities
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.grype.yaml:/etc/grype.yaml:ro"
          --volume rezumi-grype-cache:/root/.cache/grype
          anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d
          rezumi-worker:latest --config /etc/grype.yaml --fail-on high --only-fixed
      - name: Scan web image for fixable high vulnerabilities
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.grype.yaml:/etc/grype.yaml:ro"
          --volume rezumi-grype-cache:/root/.cache/grype
          anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d
          rezumi-web:latest --config /etc/grype.yaml --fail-on high --only-fixed
      - name: Scan minimized web-edge runtime for fixable high vulnerabilities
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.grype.yaml:/etc/grype.yaml:ro"
          --volume rezumi-grype-cache:/root/.cache/grype
          anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d
          rezumi-web-edge:latest
          --config /etc/grype.yaml --fail-on high --only-fixed
      - if: always()
        run: docker compose -f infra/compose.yaml --project-directory . down --volumes --remove-orphans
