name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --package careeros-api
      - run: pnpm contracts:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careeros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CAREEROS_DATABASE_URL: postgresql+asyncpg://careeros:ci-only-password@127.0.0.1:5432/careeros
      CAREEROS_TEST_DATABASE_URL: postgresql+asyncpg://careeros:ci-only-password@127.0.0.1:5432/careeros
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: uv lock --check
      - run: uv sync --frozen --all-packages --all-groups
      - run: cd packages/backend && uv run --package careeros-backend ruff format --check .
      - run: cd packages/backend && uv run --package careeros-backend ruff check .
      - run: cd packages/backend && uv run --package careeros-backend mypy
      - run: cd packages/backend && uv run --package careeros-backend pytest tests/architecture tests/unit
      - run: cd apps/api && uv run ruff format --check .
      - run: cd apps/api && uv run ruff check .
      - run: cd apps/api && uv run mypy
      - run: cd apps/api && uv run pytest
      - run: uv run --package careeros-api ruff format --config apps/api/pyproject.toml --check packages/contracts/scripts/export_openapi.py
      - run: uv run --package careeros-api ruff check --config apps/api/pyproject.toml packages/contracts/scripts/export_openapi.py
      - run: test "$(uv run --package careeros-backend alembic -c packages/backend/alembic.ini heads | sed -n '/^[^[:space:]][^[:space:]]* (head)$/p')" = "20260719_0005 (head)"
      - run: uv run --package careeros-backend alembic -c packages/backend/alembic.ini upgrade head
      - run: uv run --package careeros-backend alembic -c packages/backend/alembic.ini downgrade 20260715_0004
      - run: uv run --package careeros-backend alembic -c packages/backend/alembic.ini upgrade head
      - run: test "$(uv run --package careeros-backend alembic -c packages/backend/alembic.ini current | sed -n '/^[^[:space:]][^[:space:]]* (head)$/p')" = "20260719_0005 (head)"
      - run: cd packages/backend && uv run --package careeros-backend pytest tests/integration
      - run: uv run --package careeros-api python -c "from careeros_api.main import app; assert app.openapi()"

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --package careeros-worker --all-groups
      - run: cd apps/worker && uv run ruff format --check .
      - run: cd apps/worker && uv run ruff check .
      - run: cd apps/worker && uv run mypy
      - run: cd apps/worker && uv run pytest
      - run: uv run --package careeros-worker python -c "from careeros_worker.app import celery_app; assert celery_app.main == 'careeros_worker'"

  browser-smoke:
    runs-on: ubuntu-latest
    needs: [web-and-contracts]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @careeros/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  resume-health-e2e:
    runs-on: ubuntu-latest
    needs: [api, worker, web-and-contracts]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-packages --all-groups
      - run: pnpm --filter @careeros/web exec playwright install --with-deps chromium
      - name: Run the isolated authentication and Resume Health journeys
        run: CAREEROS_E2E_PHASE=2 sh tests/e2e/run-compose.sh

  career-record-e2e:
    runs-on: ubuntu-latest
    needs: [api, worker, web-and-contracts]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-packages --all-groups
      - run: pnpm --filter @careeros/web exec playwright install --with-deps chromium
      - name: Run the isolated Phase 3 Career Record journey suite
        run: CAREEROS_E2E_PHASE=3 sh tests/e2e/run-compose.sh

  role-explorer-e2e:
    runs-on: ubuntu-latest
    needs: [api, worker, web-and-contracts]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-packages --all-groups
      - run: pnpm --filter @careeros/web exec playwright install --with-deps chromium
      - name: Run the isolated Phase 4 Role Explorer journey suite
        run: CAREEROS_E2E_PHASE=4 sh tests/e2e/run-compose.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Scan the working tree for committed secrets
        run: >-
          docker run --rm --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run --package careeros-api --with pip-audit==2.10.1 pip-audit

  containers:
    runs-on: ubuntu-latest
    needs: [api, worker, web-and-contracts]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build api worker web
      - name: Start the Compose platform
        run: |
          if ! docker compose up --detach --wait --wait-timeout 300; then
            docker compose ps --all
            docker compose logs --no-color --tail 200
            exit 1
          fi
      - name: Verify the packaged Phase 4 migration path
        run: |
          heads=$(docker compose run --rm --no-deps api alembic -c packages/backend/alembic.ini heads | sed -n '/^[^[:space:]][^[:space:]]* (head)$/p')
          printf '%s\n' "$heads"
          test "$heads" = "20260719_0005 (head)"
          docker compose run --rm --no-deps api alembic -c packages/backend/alembic.ini upgrade head
          docker compose run --rm --no-deps api alembic -c packages/backend/alembic.ini downgrade 20260715_0004
          docker compose run --rm --no-deps api alembic -c packages/backend/alembic.ini upgrade head
          current=$(docker compose run --rm --no-deps api alembic -c packages/backend/alembic.ini current | sed -n '/^[^[:space:]][^[:space:]]* (head)$/p')
          printf '%s\n' "$current"
          test "$current" = "20260719_0005 (head)"
      - name: Probe the running platform
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/meta
          curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/info
          docker compose exec -T worker celery --app careeros_worker.app:celery_app inspect ping --timeout 5
          scheduler_id=$(docker compose ps --quiet worker-scheduler)
          test -n "$scheduler_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$scheduler_id")" = healthy
      - name: Scan API image for fixable high vulnerabilities
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.grype.yaml:/etc/grype.yaml:ro"
          --volume careeros-grype-cache:/root/.cache/grype
          anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d
          careeros-api:latest --config /etc/grype.yaml --fail-on high --only-fixed
      - name: Scan worker image for fixable high vulnerabilities
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.grype.yaml:/etc/grype.yaml:ro"
          --volume careeros-grype-cache:/root/.cache/grype
          anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d
          careeros-worker:latest --config /etc/grype.yaml --fail-on high --only-fixed
      - name: Scan web image for fixable high vulnerabilities
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.grype.yaml:/etc/grype.yaml:ro"
          --volume careeros-grype-cache:/root/.cache/grype
          anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d
          careeros-web:latest --config /etc/grype.yaml --fail-on high --only-fixed
      - name: Scan trusted web-edge runtime for fixable high vulnerabilities
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "$PWD/.grype.yaml:/etc/grype.yaml:ro"
          --volume careeros-grype-cache:/root/.cache/grype
          anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d
          node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
          --config /etc/grype.yaml --fail-on high --only-fixed
      - if: always()
        run: docker compose down --volumes --remove-orphans
