name: careeros

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CAREEROS_ENVIRONMENT: ${ENVIRONMENT:-development}
  CAREEROS_LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CAREEROS_DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://careeros:change-me-local-only@postgres:5432/careeros}
  CAREEROS_TRUSTED_HOSTS: '["localhost","127.0.0.1","testserver","api"]'
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://careeros:change-me-local-only@postgres:5432/careeros}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CAREEROS_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-careeros-documents}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-careeros-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-local-only}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  CAREEROS_AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-change-me-local-only-auth-token-pepper}
  CAREEROS_ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000"]}'
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
  CAREEROS_COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CAREEROS_SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-900}
  CAREEROS_REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
  CAREEROS_RECENT_AUTH_TTL_SECONDS: ${RECENT_AUTH_TTL_SECONDS:-600}
  CAREEROS_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
  CAREEROS_EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  CAREEROS_EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@careeros.local}
  CAREEROS_SMTP_HOST: ${SMTP_HOST:-mailpit}
  CAREEROS_SMTP_PORT: ${SMTP_PORT:-1025}
  CAREEROS_SMTP_USERNAME: ${SMTP_USERNAME:-}
  CAREEROS_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  CAREEROS_SMTP_START_TLS: ${SMTP_START_TLS:-false}
  CAREEROS_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  CAREEROS_GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
  CAREEROS_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  CAREEROS_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  CAREEROS_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/v1/auth/google/callback}
  CAREEROS_CONSENT_POLICY_VERSION: ${CONSENT_POLICY_VERSION:-2026-07-15}

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careeros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-careeros}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine@sha256:223b183cbc49f5ff48728e1fc52ccf101f05072decad2bd9867281a3c9bf75fd
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-careeros-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-careeros-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      S3_BUCKET: ${S3_BUCKET:-careeros-documents}
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set none "local/$${S3_BUCKET}";
      '
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=9)",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "careeros_worker.healthcheck"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_MAX: "500"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4_base@sha256:d54ef59d5d07ff243c669789f51e0c3d9dfa9945f62b515be84febe8e1db0dbf
    profiles: ["security"]
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-careeros}-local
