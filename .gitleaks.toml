title = "Rezumi secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Ignored local runtime secrets and generated dependency/build artifacts"
paths = [
  # `.env` is gitignored local runtime configuration. Keep `.env.example` scanned.
  '''(^|/)\.env$''',
  '''(^|/)\.git/''',
  '''(^|/)\.next/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.data/''',
  '''(^|/)node_modules/''',
  '''(^|/)test-results/''',
  '''(^|/)dist/''',
  '''(^|/)__pycache__/''',
]
