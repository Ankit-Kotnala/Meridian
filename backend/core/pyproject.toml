[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "rezumi-backend"
version = "0.1.0"
description = "Shared Rezumi backend foundation"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "structlog==26.1.0",
]

[project.optional-dependencies]
database = [
  "asyncpg==0.31.0",
  "sqlalchemy[asyncio]==2.0.52",
]
identity = [
  "aiosmtplib==5.1.2",
  "argon2-cffi==25.1.0",
  "authlib==1.7.2",
  "cryptography>=50.0.0",
  "email-validator==2.3.0",
  "httpx==0.28.1",
  "redis==6.4.0",
]
resume = [
  "boto3==1.43.60",
  "celery[redis]==5.6.3",
  "pymongo==4.16.0",
  "pypdf==6.15.0",
  "python-docx==1.2.0",
  "reportlab==5.0.0",
]
migrations = [
  "alembic==1.18.5",
]

[dependency-groups]
dev = [
  "alembic==1.18.5",
  "aiosmtplib==5.1.2",
  "argon2-cffi==25.1.0",
  "authlib==1.7.2",
  "asyncpg==0.31.0",
  "boto3==1.43.60",
  "celery[redis]==5.6.3",
  "cryptography>=50.0.0",
  "email-validator==2.3.0",
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pymongo==4.16.0",
  "pypdf==6.15.0",
  "python-docx==1.2.0",
  "redis==6.4.0",
  "ruff==0.15.21",
  "sqlalchemy[asyncio]==2.0.52",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rezumi"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Curated natural-language content, not code -- long prose strings are expected.
"src/rezumi/development/seed_role_roadmaps.py" = ["E501"]
"src/rezumi/modules/career_growth/infrastructure/role_roadmap_catalog/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
packages = ["rezumi"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["authlib", "authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "celery", "celery.*", "docx", "docx.*", "kombu", "kombu.*", "pypdf", "pypdf.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true
