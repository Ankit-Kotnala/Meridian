[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "rezumi-api"
version = "0.1.0"
description = "Rezumi FastAPI service"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "rezumi-backend[database,identity,migrations,resume]==0.1.0",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.0",
]

[tool.uv.sources]
rezumi-backend = { workspace = true }

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rezumi_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
packages = ["rezumi_api"]
mypy_path = "src"
